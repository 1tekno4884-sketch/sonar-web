<!doctype html>
<html lang="en" data-app="sonar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Games · Sonar</title>
<meta name="theme-color" content="#1E88A8">
<style>
:root{--acc:#1E88A8;--bg:#f4f8fb;--fg:#0d1b24;--sub:#5a6d78;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#071118;--fg:#e8f3f8;--sub:#93a9b4;--card:#10202a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:16px max(16px,env(safe-area-inset-left));max-width:1000px;margin:0 auto}
header a{color:var(--acc);text-decoration:none;font-weight:600}header h1{margin:0;font-size:26px;flex:1}
#games{max-width:1000px;margin:0 auto;padding:0 16px 40px}
.wg-lead{color:var(--sub);margin:0 0 8px}.wg-shelf{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);margin:22px 0 10px}
.wg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.wg-tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.wg-art{width:100%;aspect-ratio:1;border-radius:24px;display:grid;place-items:center;font-size:44px;box-shadow:0 6px 18px #0002;transition:transform .15s}
.wg-tile:hover .wg-art,.wg-tile:focus-visible .wg-art{transform:translateY(-3px)}.wg-name{font-weight:600;margin-top:6px}.wg-sub{font-size:13px;color:var(--sub)}
.wg-empty{text-align:center;padding:60px 16px}.wg-btn{display:inline-block;background:var(--acc);color:#fff;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:600}
.wg-player{position:fixed;inset:0;z-index:100;background:#000}.wg-player iframe{width:100%;height:100%;border:0;display:block}
.wg-splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;font-size:22px}.wg-glyph{font-size:72px}
body.wg-open{overflow:hidden}
@media (min-width:700px){.wg-player{inset:24px;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px #0008}.wg-player iframe{max-width:none}}
@media (prefers-reduced-motion:reduce){.wg-art{transition:none}}
</style>
</head>
<body>
<header><a href="./" aria-label="Back to Sonar">← Sonar</a><h1>Games</h1></header>
<main id="games" aria-live="polite">Loading…</main>
<script src="waves/games-web.js"></script>
</body>
</html>
