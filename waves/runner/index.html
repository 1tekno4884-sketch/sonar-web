#k-status{text-align:center;color:var(--sub);font-size:14px;min-height:20px;padding:0 12px 4px;flex:0 0 auto}

.k-card .k-emb{font-size:44px;line-height:1;margin-bottom:8px}

.k-btn.p{background:var(--acc);color:var(--on)}

.k-row{display:flex;gap:8px}.k-row .k-btn{flex:1}

.k-seg button.on{background:var(--acc);color:var(--on)}
.k-chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--line);font-size:13px;font-weight:600}
