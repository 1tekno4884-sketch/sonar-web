Kit.boot({ title: 'Tidepool Pairs', accent: '#22A89A', onRestart: () => Kit.hook(0), menuExtra: [{ label: 'Change board', on: () => Kit.hook(1)}] }, () => {
Kit.hooks = [() => newGame(size), () => pick()];
const C = Kit.colors;
const SIZES = [{ c: 4, r: 3, n: 'Small 4×3' }, { c: 4, r: 4, n: 'Medium 4×4' }, { c: 5, r: 6, n: 'Large 5×6' }];
const SEA = ['🐙', '🦀', '🐠', '🐡', '🦑', '🐚', '🐬', '🐳', '🦈', '🐢', '🦞', '🦐', '🐟', '🐋', '🦭'];
let size = 1, deck = [], done = [], open = [], moves = 0, secs = 0, shown = -1, over = true, best = {}, els = [], hideT = 0;

const grid = Kit.$('div', 'pg'); Kit.stage.append(grid);
const fmt = (s) => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
const pairs = () => deck.length / 2;

const S = SIZES[size], r = Kit.stage.getBoundingClientRect();
if (r.width < 10) return;
const gap = Math.max(6, Math.min(14, r.width / 45));
const cw = Math.max(30, Math.min((r.width - 28 - gap * (S.c - 1)) / S.c, ((r.height - 28 - gap * (S.r - 1)) / S.r) / 1.25, 130));
grid.style.gridTemplateColumns = `repeat(${S.c}, ${cw}px)`; grid.style.gap = gap + 'px';
grid.style.setProperty('--cw', cw + 'px'); grid.style.setProperty('--ch', cw * 1.25 + 'px');
}

deck.forEach((v, i) => {
const c = Kit.$('div', 'pc', `<div class="bk"></div><div class="fr">${SEA[v]}</div>`);

els.push(c); grid.append(c);

function paint() {

const [a, b] = open;

Kit.menu({ emoji: '🐚', title: 'Tidepool Pairs', text: 'Flip two cards at a time and match every creature. Bigger boards score more.',

Kit.onPause(save);

deck = s.game.deck; done = s.game.done; moves = s.game.moves; secs = s.game.secs || 0; over = false; render();
Kit.toast('Resumed your game');
} else { newGame(size); over = true; pick(); }

});
