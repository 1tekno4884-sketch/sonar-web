}
function update(dt) {

const n = Math.ceil(Math.hypot(b.vx, b.vy) * dt / 4);

if (state !== 'play') return;

for (const p of pows) {
p.y += 150 * dt;
if (p.y > PY - 8 && p.y < PY + 22 && Math.abs(p.x - px) < pw / 2 + 18) { p.got = true; power(p); }

}
function menu(over, isBest) {
Kit.menu({
emoji: over ? (isBest ? '🏆' : '🪸') : '🪸', title: over ? (isBest ? 'New best!' : 'Game over') : 'Coral Breaker',
text: over ? `Score ${score} · Level ${level} · Best ${best}` : 'Drag to slide the paddle, lift to launch. Smash all the coral, catch the power-ups!',

});
}
function draw() {
const { ctx } = g, { s, x: ox, y: oy } = geo();
ctx.clearRect(0, 0, g.w, g.h);
ctx.save(); ctx.translate(ox, oy); ctx.scale(s, s);
ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 6;
const gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, P.w0); gr.addColorStop(1, P.w1);
ctx.fillStyle = gr; Kit.rr(ctx, -4, -4, W + 8, H + 8, 20); ctx.fill(); ctx.restore();
ctx.save(); Kit.rr(ctx, -4, -4, W + 8, H + 8, 20); ctx.clip();

for (const [bx, hgt] of [[18, 160], [44, 110], [W - 24, 190], [W - 52, 120]]) {
ctx.beginPath(); ctx.moveTo(bx - 9, H + 4);
for (let y = 0; y <= hgt; y += 10) ctx.lineTo(bx + Math.sin(y * 0.06 + (RM ? 0 : t * 1.5)) * 7 - 5 * (1 - y / hgt), H - y);
for (let y = hgt; y >= 0; y -= 10) ctx.lineTo(bx + Math.sin(y * 0.06 + (RM ? 0 : t * 1.5)) * 7 + 5 * (1 - y / hgt), H - y);

}
ctx.strokeStyle = P.bub; ctx.lineWidth = 1.5;
for (const b of bubbles) { ctx.beginPath(); ctx.arc(b.x + Math.sin(b.y * 0.05) * 4, b.y, b.r, 0, 6.283); ctx.stroke(); }
for (const k of bricks) {
const j = k.hit > 0 && !RM ? 1.5 : 0;
if (k.hp >= 9) {
ctx.fillStyle = P.rock; Kit.rr(ctx, k.x, k.y + j, BW, BH, 7); ctx.fill();
ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.arc(k.x + 10, k.y + 7 + j, 3, 0, 6.283); ctx.arc(k.x + 26, k.y + 11 + j, 2.5, 0, 6.283); ctx.fill();
continue;
}
const col = k.hp > 1 ? Kit.mix(k.col, '#000000', 0.22) : k.col;
ctx.fillStyle = k.hit > 0 ? '#ffffff' : col; Kit.rr(ctx, k.x, k.y + j, BW, BH, 8); ctx.fill();
ctx.fillStyle = 'rgba(255,255,255,.35)'; Kit.rr(ctx, k.x + 4, k.y + 3 + j, BW - 8, 4, 2); ctx.fill();
ctx.fillStyle = 'rgba(255,255,255,.4)';
for (let i = 0; i < (k.hp > 1 ? 4 : 2); i++) { ctx.beginPath(); ctx.arc(k.x + 8 + i * 8, k.y + 12 + j + (i % 2) * 2, 1.6, 0, 6.283); ctx.fill(); }
if (k.max > 1 && k.hp === 1) { ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(k.x + 14, k.y + j); ctx.lineTo(k.x + 19, k.y + 9 + j); ctx.lineTo(k.x + 15, k.y + BH + j); ctx.stroke(); }
}
for (const p of pows) {
const col = p.type === 'wide' ? '#4fcfc2' : p.type === 'multi' ? '#c58cf0' : '#ff7a8a';
ctx.fillStyle = col; Kit.rr(ctx, p.x - 22, p.y - 10, 44, 20, 10); ctx.fill();
ctx.fillStyle = '#fff'; ctx.font = '800 11px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
ctx.fillText(p.type === 'wide' ? 'WIDE' : p.type === 'multi' ? 'MULTI' : '♥ +1', p.x, p.y + 0.5);
}
const pg = ctx.createLinearGradient(0, PY, 0, PY + 14); pg.addColorStop(0, C.acc2); pg.addColorStop(1, C.acc);
ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
ctx.fillStyle = pg; Kit.rr(ctx, px - pw / 2, PY, pw, 14, 7); ctx.fill(); ctx.restore();
ctx.fillStyle = 'rgba(255,255,255,.5)'; Kit.rr(ctx, px - pw / 2 + 8, PY + 3, pw - 16, 3, 1.5); ctx.fill();
for (const b of balls) {
const bg = ctx.createRadialGradient(b.x - 2, b.y - 2, 1, b.x, b.y, 7); bg.addColorStop(0, '#ffffff'); bg.addColorStop(1, D ? '#cfe3ef' : '#e9dcc9');
ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(b.x, b.y, 7, 0, 6.283); ctx.fill();
ctx.strokeStyle = 'rgba(0,0,0,.12)'; ctx.lineWidth = 1; ctx.stroke();
}
for (const p of parts) { ctx.globalAlpha = Math.max(0, p.l / 0.6); ctx.fillStyle = p.col; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
ctx.globalAlpha = 1;
if (state === 'play' && balls.some((b) => b.stuck) && hold <= 0) {
ctx.fillStyle = D ? 'rgba(255,255,255,.7)' : 'rgba(0,40,60,.55)'; ctx.font = '600 15px system-ui,sans-serif'; ctx.textAlign = 'center';
ctx.fillText('Lift your finger to launch', W / 2, PY - 40);
}
if (state === 'play' && hold > 0) { ctx.fillStyle = C.fg; ctx.font = '700 24px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(`Level ${level}`, W / 2, H * 0.62); }
ctx.restore(); ctx.restore();
}
const toWorld = (x) => { const { s, x: ox } = geo(); return (x - ox) / s; };
Kit.pointer(g.cv, {
down(x) { if (state === 'play') px = toWorld(x); },
move(x) { if (state === 'play') px = toWorld(x); },
up() { if (state === 'play' && hold <= 0) launch(); },
});
addEventListener('keydown', (e) => {
if (ov()) return;
keys[e.key] = true;
if ((e.key === ' ' || e.key === 'ArrowUp') && state === 'play' && hold <= 0) { launch(); e.preventDefault(); }
if (e.key === 'Escape' && state === 'play') Kit.pauseMenu();
});
addEventListener('keyup', (e) => { keys[e.key] = false; });
Kit.onPause(() => { keys = {}; setTimeout(() => { if (Kit.paused && state === 'play' && !ov()) Kit.pauseMenu(); }, 0); });
Kit.onResume(() => { if (ov()) Kit.paused = true; else hold = 0.8; });
Kit.loop((dt) => {
t += dt;
if (state === 'play') { if (hold > 0) hold -= dt; else update(dt); }
if (!RM) for (const b of bubbles) { b.y -= b.v * dt; if (b.y < -10) { b.y = H + 10; b.x = Math.random() * W; } }
for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.l -= dt; }
if (parts.length) parts = parts.filter((p) => p.l > 0);

});
bricks = layout(1); serve(); draw(); Kit.ready(); Kit.status(`Best ${best}`);
menu(false);
});
