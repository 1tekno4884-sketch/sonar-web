ctx.fillStyle = C.fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `700 ${Math.round(c * 0.52)}px system-ui,sans-serif`;
for (let i = 0; i < N * N; i++) ctx.fillText(grid[i], x + (i % N + 0.5) * c, y + (((i / N) | 0) + 0.5) * c + c * 0.03);
}
function renderList() {
list.textContent = '';
words.forEach((w, i) => { const e = Kit.$('span'); e.textContent = w.w; const n = found.indexOf(i); if (n >= 0) { e.className = 'f'; e.style.background = HUES[n % HUES.length]; } list.append(e); });
layout();
}
function hud() { Kit.score(fmt(secs)); Kit.status(`${THEMES[theme].n} · ${found.length}/${words.length} found${best[theme] ? ' · best ' + fmt(best[theme]) : ''}`); }
function tryPick(a, b) {
const cells = line(a, b); if (!cells || cells.length < 2) return false;
const str = cells.map((i) => grid[i]).join(''), rev = str.split('').reverse().join('');
const wi = words.findIndex((w, i) => !found.includes(i) && (w.w === str || w.w === rev));
if (wi < 0) { Kit.sfx('bounce'); return false; }
words[wi].a = a; words[wi].b = b; found.push(wi); Kit.sfx('good'); Kit.haptic('medium');
renderList(); hud(); draw(); save();
if (found.length === words.length) finish();
return true;
}
function finish() {
over = true; const t = Math.max(1, Math.round(secs)), prev = best[theme];
if (!prev || t < prev) best[theme] = t;
Kit.submit(t); Kit.sfx('win'); Kit.haptic('success'); save();
setTimeout(() => Kit.menu({ emoji: '🌿', title: 'All words caught!', text: `${THEMES[theme].n} in ${fmt(t)}${prev && t < prev ? ' — new best!' : ''}`,
buttons: [{ label: 'Another puzzle', primary: true, on: () => newGame(theme) }, { label: 'Change theme', on: pick }] }), 600);
}
function newGame(t) {
theme = t; const p = generate(t); grid = p.grid; words = p.words; found = []; secs = 0; over = false; sel = null; anchor = -1;
renderList(); hud(); draw(); save();
}
function save() { Kit.save({ best, theme, game: over || !grid ? null : { theme, grid, words, found, secs: Math.floor(secs) } }); }
function pick() {
Kit.menu({ emoji: '🌿', title: 'Kelp Words', text: 'Pick a theme. Words hide across, down, diagonal and backwards.',
buttons: THEMES.map((t, i) => ({ label: t.n + (best[i] ? ` · ${fmt(best[i])}` : ''), primary: i === theme, on: () => newGame(i) })) });
}
const cellAt = (px, py) => { const { x, y, c } = geo(); const cx = Math.floor((px - x) / c), cy = Math.floor((py - y) / c); return cx < 0 || cy < 0 || cx >= N || cy >= N ? -1 : cy * N + cx; };
function snapTo(a, px, py) {   // nearest 8-way line from cell a toward the pointer, clamped to the grid
const { x, y, c } = geo(), [x0, y0] = xy(a), dx = (px - x) / c - (x0 + 0.5), dy = (py - y) / c - (y0 + 0.5);
const oct = ((Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) % 8) + 8) % 8, d = DIRS[oct];
let len = Math.round(d[0] && d[1] ? (Math.abs(dx) + Math.abs(dy)) / 2 : Math.abs(d[0] ? dx : dy));
while (len > 0 && (x0 + d[0] * len < 0 || x0 + d[0] * len >= N || y0 + d[1] * len < 0 || y0 + d[1] * len >= N)) len--;
return (y0 + d[1] * len) * N + x0 + d[0] * len;
}
Kit.pointer(g.cv, {
down(px, py) { if (over) return; const i = cellAt(px, py); if (i < 0) return; sel = { a: anchor >= 0 ? anchor : i, b: anchor >= 0 ? i : i, tap: anchor >= 0 }; if (!sel.tap) anchor = -1; draw(); },
move(px, py) { if (!sel || sel.tap) return; const b = snapTo(sel.a, px, py); if (b !== sel.b) { sel.b = b; Kit.sfx('tap'); draw(); } },
up() {
if (!sel) return; const { a, b, tap } = sel; sel = null;
if (tap) { anchor = -1; if (!line(a, b) || !tryPick(a, b)) draw(); return; }
if (a === b) { anchor = a; Kit.sfx('tap'); draw(); return; }
if (!tryPick(a, b)) draw();
},
});
Kit.onPause(save);
Kit.loop((dt) => {
if (over || !grid || document.querySelector('.k-ov')) return;
secs += dt; if (Math.floor(secs) !== shown) { shown = Math.floor(secs); hud(); if (shown % 15 === 0) save(); }
});
Kit.load().then((s) => {
if (s && s.best) best = s.best;
if (s && typeof s.theme === 'number' && THEMES[s.theme]) theme = s.theme;
const gm = s && s.game;
if (gm && gm.grid && gm.grid.length === N * N && THEMES[gm.theme]) {
theme = gm.theme; grid = gm.grid; words = gm.words; found = gm.found || []; secs = gm.secs || 0; over = false;
renderList(); hud(); draw(); Kit.toast('Resumed your puzzle');
} else { newGame(theme); over = true; save(); pick(); }
Kit.ready();
});
});
</script></body></html>
