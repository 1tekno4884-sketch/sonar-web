tb('⌫', 'Erase', () => input(0)); tb('💡', 'Hint', hint); const bBad = tb('⚠️', 'Mistakes', () => { showBad = !showBad; Kit.sfx('tap'); render(); save(); });
const keys = [];
for (let v = 1; v <= 9; v++) { const b = Kit.$('button', '', `${v}<small></small>`); b.onclick = () => input(v); keys.push(b); pad.append(b); }
function layout() {
const r = Kit.stage.getBoundingClientRect(); if (r.width < 10) return;
const s = Math.floor(Math.min(r.width - 24, r.height - 18 - 150, 560));
board.style.width = board.style.height = s + 'px'; board.style.setProperty('--cs', s / 9 + 'px');
pad.style.width = s + 'px';
const kh = Math.max(44, Math.min(64, (r.height - s - 100))); for (const k of keys) k.style.height = kh + 'px';
}
new ResizeObserver(layout).observe(Kit.stage);
function render() {
const sv = sel >= 0 ? cur[sel] : 0;
for (let i = 0; i < 81; i++) {
const c = cells[i], v = cur[i], given = puz[i] !== 0;
const wrong = showBad && v && v !== sol[i];
c.className = 'sc' + (given ? ' g' : '') +
(i === sel ? ' sel' : sel >= 0 && (R[i] === R[sel] || Cc[i] === Cc[sel] || B[i] === B[sel]) ? ' peer' : '') +
(sv && v === sv && i !== sel ? ' same' : '') + (wrong ? ' bad' : '') + (i === popAt && !Kit.reduceMotion ? ' pop' : '');
if (wrong && !given) c.style.background = 'var(--badbg)'; else c.style.background = '';
if (v) c.textContent = v;
else if (notes[i]) { let h = '<div class="sn">'; for (let k = 1; k <= 9; k++) h += `<b class="${notes[i] & (1 << k) ? 'on' : ''}">${k}</b>`; c.innerHTML = h + '</div>'; }
else c.textContent = '';
}
popAt = -1;
const cnt = Array(10).fill(0); for (const v of cur) cnt[v]++;
keys.forEach((k, j) => { k.lastChild.textContent = 9 - cnt[j + 1] > 0 ? 9 - cnt[j + 1] : ''; k.classList.toggle('done', cnt[j + 1] >= 9); });
pad.classList.toggle('notes', noteMode); bNotes.classList.toggle('on', noteMode); bBad.classList.toggle('on', showBad);
Kit.score(fmt(secs)); Kit.status(`${D[diff].n}${hints ? ` · ${hints} hint${hints > 1 ? 's' : ''}` : ''}${noteMode ? ' · notes on' : ''}`);
}
function input(v) {
if (over || sel < 0 || puz[sel]) { if (!over && sel < 0) Kit.toast('Tap a square first'); return; }
const i = sel, ch = [[i, cur[i], notes[i]]];
if (noteMode && v) {
if (cur[i]) return;
notes[i] ^= 1 << v;
} else {
if (cur[i] === v && !notes[i]) return;
cur[i] = v; notes[i] = 0;
if (v) for (const j of PEERS[i]) if (notes[j] & (1 << v)) { ch.push([j, cur[j], notes[j]]); notes[j] &= ~(1 << v); }
popAt = v ? i : -1;
if (v && v !== sol[i]) { Kit.haptic(showBad ? 'warning' : 'light'); if (showBad) Kit.sfx('bad'); else Kit.sfx('tap'); } else { Kit.sfx(v ? 'pop' : 'tap'); Kit.haptic('light'); }
}
undo.push(ch); if (undo.length > 200) undo.shift();
after();
}
function after() {
render(); save();
if (cur.every((v, i) => v === sol[i])) finish();
}
function doUndo() {
if (over || !undo.length) return;
for (const [i, v, n] of undo.pop().reverse()) { cur[i] = v; notes[i] = n; }
Kit.sfx('tap'); render(); save();
}
function hint() {
if (over) return;
let i = sel >= 0 && cur[sel] !== sol[sel] ? sel : -1;
if (i < 0) { const open = []; for (let k = 0; k < 81; k++) if (cur[k] !== sol[k]) open.push(k); if (!open.length) return; i = open[Kit.ri(0, open.length - 1)]; }
undo.push([[i, cur[i], notes[i]]]);
cur[i] = sol[i]; notes[i] = 0; for (const j of PEERS[i]) notes[j] &= ~(1 << sol[i]);
hints++; secs += 20; sel = i; popAt = i; Kit.sfx('good'); Kit.toast('Hint: +20 s');
after();
}
function finish() {
over = true;
const t = Math.max(1, Math.round(secs)), prev = best[diff];
if (!prev || t < prev) best[diff] = t;
if (diff === 1) Kit.submit(t);
Kit.sfx('win'); Kit.haptic('success'); sel = -1; render(); save();
setTimeout(() => Kit.menu({ emoji: '🏖️', title: 'Solved!', text: `${D[diff].n} in ${fmt(t)}${hints ? ` (${hints} hint${hints > 1 ? 's' : ''})` : ''}${prev && t < prev ? ' — new best!' : ''}${diff !== 1 ? '. The leaderboard counts Medium times.' : ''}`,
buttons: [{ label: 'Next puzzle', primary: true, on: () => newGame(diff) }, { label: 'Change difficulty', on: pick }] }), 600);
}
function newGame(d) {
diff = d; const p = generate(D[d].clues);
puz = p.puz; sol = p.sol; cur = puz.slice(); notes = Array(81).fill(0); undo = []; hints = 0; secs = 0; sel = -1; over = false; noteMode = false;
render(); save();
}
function save() {
Kit.save({ best, diff, showBad, game: over ? null : { puz: puz.join(''), sol: sol.join(''), cur: cur.join(''), notes, secs: Math.floor(secs), hints } });
}
function pick() {
Kit.menu({ emoji: '🏖️', title: 'Sudoku Sands', text: 'Fill every row, column and box with 1 to 9.',
buttons: D.map((d, i) => ({ label: d.n + (best[i] ? ` · best ${fmt(best[i])}` : ''), primary: i === diff, on: () => newGame(i) })) });
}
addEventListener('keydown', (e) => {
if (over || document.querySelector('.k-ov')) return;
const k = e.key, mv = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -9, ArrowDown: 9 }[k];
if (mv) { sel = sel < 0 ? 40 : Math.min(80, Math.max(0, sel + mv)); render(); e.preventDefault(); }
else if (k >= '1' && k <= '9') input(+k);
else if (k === '0' || k === 'Backspace' || k === 'Delete') input(0);
else if (k === 'n' || k === 'N') { noteMode = !noteMode; render(); }
else if (k === 'z' && (e.ctrlKey || e.metaKey)) doUndo();
});
Kit.onPause(save);
Kit.loop((dt) => {
if (over || document.querySelector('.k-ov')) return;
secs += dt; if (Math.floor(secs) !== shown) { shown = Math.floor(secs); Kit.score(fmt(secs)); if (shown % 15 === 0) save(); }
});
const digits = (s) => s.split('').map(Number);
Kit.load().then((s) => {
if (s && s.best) best = s.best;
if (s && typeof s.diff === 'number') diff = s.diff;
if (s && s.showBad === false) showBad = false;
const gm = s && s.game;
if (gm && gm.puz && gm.puz.length === 81) {
puz = digits(gm.puz); sol = digits(gm.sol); cur = digits(gm.cur); notes = gm.notes || Array(81).fill(0); secs = gm.secs || 0; hints = gm.hints || 0; over = false;
render(); Kit.toast('Resumed your puzzle');
} else { puz = Array(81).fill(0); sol = puz; cur = puz.slice(); notes = puz.slice(); render(); pick(); }
layout(); Kit.ready();
});
});
</script></body></html>
