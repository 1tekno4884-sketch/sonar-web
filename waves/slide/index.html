.k-seg button.on{background:var(--acc);color:var(--on)}

fish(0.25, 0.58, 0.04, '#ffd23f', 1); fish(0.33, 0.63, 0.03, '#ffd23f', 1); fish(0.72, 0.66, 0.045, '#ff7b54', -1); fish(0.5, 0.76, 0.035, '#9be7ff', 1); fish(0.82, 0.55, 0.028, '#ff9ecf', -1);
for (const [cx, cy, r] of [[0.58, 0.6, 0.012], [0.6, 0.55, 0.008], [0.57, 0.51, 0.006], [0.18, 0.72, 0.01], [0.2, 0.67, 0.007]]) { x.strokeStyle = 'rgba(255,255,255,.6)'; x.lineWidth = S * 0.004; x.beginPath(); x.arc(cx * S, cy * S, r * S, 0, 7); x.stroke(); }

}
function draw() {

ctx.clearRect(0, 0, g.w, g.h);
const { s, x, y, t } = geo(), gap = Math.max(3, t * 0.045), r = Math.max(6, t * 0.14);

ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 6;

ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.22)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
Kit.rr(ctx, px, py, w, w, r); ctx.fillStyle = C.card; ctx.fill(); ctx.restore();
ctx.save(); Kit.rr(ctx, px, py, w, w, r); ctx.clip();
if (pic) {
ctx.drawImage(scene, (hx * t + gap / 2) * sd, (hy * t + gap / 2) * sd, w * sd, w * sd, px, py, w, w);
{ ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(px + w * 0.16, py + w * 0.16, w * 0.11, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = `700 ${Math.round(w * 0.13)}px system-ui,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(k, px + w * 0.16, py + w * 0.17); }

gr.addColorStop(0, ok ? Kit.mix(C.acc, '#ffffff', 0.3) : C.acc2); gr.addColorStop(1, ok ? C.acc : Kit.mix(C.acc2, C.acc, 0.55));
ctx.fillStyle = gr; ctx.fillRect(px, py, w, w);
ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.beginPath(); ctx.ellipse(px + w * 0.3, py + w * 0.18, w * 0.28, w * 0.08, -0.3, 0, 7); ctx.fill();
ctx.fillStyle = '#ffffff'; ctx.font = `800 ${Math.round(w * 0.42)}px system-ui,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(k, px + w / 2, py + w / 2 + w * 0.03);

}
function gapAt() { return tiles.indexOf(0); }

}
function hud() { Kit.score(moves); Kit.status(`${N}×${N} · ${fmt(secs)}${best[N] ? ` · best ${best[N]} moves` : ''}`); }

if (N === 4) Kit.submit(moves);
Kit.sfx('win'); Kit.haptic('success'); save();

buttons: [{ label: 'Play again', primary: true, on: () => newGame(N) }, { label: 'Change size', on: pick }] }), 900);
}
function newGame(n) {
N = n; tiles = []; for (let i = 1; i < N * N; i++) tiles.push(i); tiles.push(0);
let e = N * N - 1, prev = -1;

function snap() { pos = []; tiles.forEach((k, i) => { if (k) pos[k] = [i % N, (i / N) | 0]; }); }

Kit.menu({ emoji: '🧩', title: 'Slide Pool', text: 'Slide the tiles back in order. Tap a tile in line with the gap, or swipe it.',
buttons: [3, 4].map((n) => ({ label: `${n}×${n}` + (best[n] ? ` · best ${best[n]} moves` : ''), primary: n === N, on: () => newGame(n) })) });
}
function cellAt(px, py) { const { x, y, t } = geo(); const c = Math.floor((px - x) / t), r = Math.floor((py - y) / t); return c < 0 || r < 0 || c >= N || r >= N ? -1 : r * N + c; }
Kit.pointer(g.cv, {
down(px, py) { press = { x: px, y: py, i: cellAt(px, py) }; },
up(px, py) {

});
