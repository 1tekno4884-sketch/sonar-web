if (flag[i]) {
drawFlag(ctx, cx, cy, cs);
if (over && !won && !mine[i]) { ctx.strokeStyle = C.bad; ctx.lineWidth = Math.max(2, cs * 0.08); ctx.beginPath(); ctx.moveTo(cx0 + cs * 0.22, cy0 + cs * 0.22); ctx.lineTo(cx0 + cs * 0.78, cy0 + cs * 0.78); ctx.moveTo(cx0 + cs * 0.78, cy0 + cs * 0.22); ctx.lineTo(cx0 + cs * 0.22, cy0 + cs * 0.78); ctx.stroke(); }
}
}
if (i === cur && !over) { ctx.strokeStyle = C.warn; ctx.lineWidth = 3; Kit.rr(ctx, cx0 + 1.5, cy0 + 1.5, cs - 3, cs - 3, rad); ctx.stroke(); }
}
}
function place(safe) {
const ban = new Set(nb(safe).concat(safe)), cells = [];
for (let i = 0; i < cols * rows; i++) if (!ban.has(i)) cells.push(i);
Kit.shuffle(cells).slice(0, M).forEach((i) => { mine[i] = 1; });
for (let i = 0; i < cols * rows; i++) num[i] = nb(i).filter((j) => mine[j]).length;
placed = true;
}
function open(i) {   // returns false if a mine was hit
if (rev[i] || flag[i]) return true;
if (mine[i]) { lose(i); return false; }
const st = [i];
while (st.length) {
const k = st.pop(); if (rev[k] || flag[k]) continue;
rev[k] = 1; if (num[k] === 0) for (const j of nb(k)) if (!rev[j] && !mine[j]) st.push(j);
}
return true;
}
function act(i, asFlag) {
if (over || i < 0) return;
if (rev[i]) {   // chord
const n = nb(i), f = n.filter((j) => flag[j]).length;
if (num[i] && f === num[i] && n.some((j) => !rev[j] && !flag[j])) { for (const j of n) if (!open(j)) return; Kit.sfx('pop'); }
else return;
} else if (asFlag) {
flag[i] = flag[i] ? 0 : 1; Kit.sfx(flag[i] ? 'drop' : 'tap'); Kit.haptic('medium');
} else {
if (flag[i]) return;
if (!placed) place(i);
if (!open(i)) return;
Kit.sfx('tap'); Kit.haptic('light');
}
if (rev.reduce((a, b) => a + b, 0) === cols * rows - M) return win();
hud(); draw(); save();
}
function lose(i) {
over = true; lost = i; won = false; Kit.sfx('lose'); Kit.haptic('error'); draw(); hud(); save();
setTimeout(() => Kit.menu({ emoji: '💥', title: 'Boom!', text: 'A sea mine went off. The bay is still waiting.',
buttons: [{ label: 'Try again', primary: true, on: () => newGame(diff) }, { label: 'Change difficulty', on: pick }, { label: 'Look at the board' }] }), 800);
}
function win() {
over = true; won = true;
for (let i = 0; i < cols * rows; i++) if (mine[i]) flag[i] = 1;
const t = Math.max(1, Math.round(secs)), prev = best[diff];
if (!prev || t < prev) best[diff] = t;
if (diff === 1) Kit.submit(t);
Kit.sfx('win'); Kit.haptic('success'); hud(); draw(); save();
setTimeout(() => Kit.menu({ emoji: '⚓', title: 'Bay cleared!', text: `${D[diff].n} in ${fmt(t)}${prev && t < prev ? ' — new best!' : ''}${diff !== 1 ? '. The leaderboard counts Medium times.' : ''}`,
buttons: [{ label: 'Play again', primary: true, on: () => newGame(diff) }, { label: 'Change difficulty', on: pick }] }), 700);
}
function newGame(d) {
diff = d; ({ c: cols, r: rows, m: M } = D[d]);
const n = cols * rows; mine = Array(n).fill(0); num = Array(n).fill(0); rev = Array(n).fill(0); flag = Array(n).fill(0);
placed = false; over = false; won = false; lost = -1; secs = 0; cur = -1; setMode(false);
hud(); draw(); save();
}
const bits = (a) => a.join('');
const unbits = (s) => s.split('').map(Number);
function save() {
Kit.save({ best, diff, game: over || !placed ? null : { mine: bits(mine), rev: bits(rev), flag: bits(flag), secs: Math.floor(secs) } });
}
function pick() {
Kit.menu({ emoji: '💣', title: 'Sea Mines', text: 'Numbers count the mines touching a square. Long-press or use Flag to mark one.',
buttons: D.map((d, i) => ({ label: `${d.n} · ${d.c}×${d.r}` + (best[i] ? ` · ${fmt(best[i])}` : ''), primary: i === diff, on: () => newGame(i) })) });
}
function cellAt(px, py) {
const { cs, x, y } = geo(), c = Math.floor((px - x) / cs), r = Math.floor((py - y) / cs);
return c < 0 || r < 0 || c >= cols || r >= rows ? -1 : r * cols + c;
}
Kit.pointer(g.cv, {
down(px, py) {
const i = cellAt(px, py); cur = -1;
press = { i, x: px, y: py, lp: false, t: setTimeout(() => { if (press && press.i === i && !over && !rev[i]) { press.lp = true; act(i, true); } }, 380) };
},
move(px, py) { if (press && Math.hypot(px - press.x, py - press.y) > 12) { clearTimeout(press.t); press = null; } },
up() { if (!press) return; clearTimeout(press.t); if (!press.lp) act(press.i, flagMode); press = null; },
});
g.cv.addEventListener('contextmenu', (e) => e.preventDefault());
addEventListener('keydown', (e) => {
if (over || document.querySelector('.k-ov')) return;
const k = e.key, mv = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[k];
if (mv) { if (cur < 0) cur = 0; else { const x = Math.min(cols - 1, Math.max(0, cur % cols + mv[0])), y = Math.min(rows - 1, Math.max(0, ((cur / cols) | 0) + mv[1])); cur = y * cols + x; } draw(); e.preventDefault(); }
else if ((k === ' ' || k === 'Enter') && cur >= 0) { act(cur, flagMode); e.preventDefault(); }
else if ((k === 'f' || k === 'F') && cur >= 0) act(cur, true);
});
Kit.onPause(save);
Kit.loop((dt) => {
if (over || !placed || document.querySelector('.k-ov')) return;
secs += dt; if (Math.floor(secs) !== shown) { shown = Math.floor(secs); Kit.score(fmt(secs)); }
});
Kit.load().then((s) => {
if (s && s.best) best = s.best;
if (s && typeof s.diff === 'number') diff = s.diff;
newGame(diff);
if (s && s.game && s.game.mine && s.game.mine.length === cols * rows) {
mine = unbits(s.game.mine); rev = unbits(s.game.rev); flag = unbits(s.game.flag); secs = s.game.secs || 0; placed = true;
for (let i = 0; i < cols * rows; i++) num[i] = nb(i).filter((j) => mine[j]).length;
hud(); draw(); Kit.toast('Resumed your game');
} else pick();
Kit.ready();
});
});
</script></body></html>
