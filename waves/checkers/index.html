}

else { pending = null; rebuild(); }

const myTurn = () => !over && !anim && (mode === 'local' || (mode === 'cpu' && turn === 0) || (mode === 'online' && turn === Kit.online.seat && !pending));

if (cs.length && cs[0].length === path.length) commit(path.slice());

}
if (path.length > 1 && i === path[path.length - 1]) return;
const v = bd[i];
if (v && own(v) === turn) {

else { path = []; Kit.toast(legalNow[0] && Math.abs((legalNow[0][1] >> 3) - (legalNow[0][0] >> 3)) === 2 ? 'A capture is waiting — you must jump' : 'That shell is stuck'); }

}
const flip = () => mode === 'online' && Kit.online.seat === 1;
function geo() {

function cellAt(px, py) {

Kit.pointer(g.cv, {
down(px, py) { downCell = cellAt(px, py); handle(downCell); },
up(px, py) { const i = cellAt(px, py); if (i >= 0 && i !== downCell && path.length) handle(i); downCell = -1; },
});
addEventListener('keydown', (e) => {

});
function shell(ctx, cx, cy, r, v, alpha) {

function draw() {

let n = name(p); if (n.length > 11) n = n.slice(0, 10) + '…'; ctx.fillText(n, chx + 38, chy + 20);

}
ctx.save(); ctx.shadowColor = 'rgba(60,35,5,.35)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 6;
ctx.fillStyle = C.dark ? '#5e4428' : '#9a7448'; Kit.rr(ctx, x - 10, y - 10, s + 20, s + 20, 18); ctx.fill(); ctx.restore();
const light = C.dark ? '#d9c39a' : '#f5e6c4', darkSq = C.dark ? '#9b7a4b' : '#cfa56c';
ctx.save(); Kit.rr(ctx, x, y, s, s, 8); ctx.clip();

Kit.loop((dt) => {

function start(m) {

function choose() { Kit.pickMode({ emoji: '🐚', title: 'Shell Checkers', text: 'Jump diagonally to capture — captures are a must. Reach the far side to be crowned.', modes: ['cpu', 'local'], online: true }, start); }
Kit.load().then((s) => { if (s && s.wins) { wins = s.wins; if (mode === 'cpu') Kit.score(wins); } });

});
